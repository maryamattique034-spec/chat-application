<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rooms</title>
</head>
<body>
    <h1>Available Rooms are:</h1>
    <ul>
        {% for room in rooms %}
        <li>
            <a href = "{% url 'room' room.name %}" >
                {{room.name}}
            </a>
        </li>
        {% empty %}
        <li>No rooms available</li>
        {% endfor %}
    </ul>
</body>
</html>
